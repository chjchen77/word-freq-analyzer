name: Build Windows application

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '**.bat'
      - 'requirements.txt'
      - 'Windows使用说明.txt'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build application
        shell: cmd
        run: build_windows.bat

      - name: Add Windows instructions
        shell: pwsh
        run: Copy-Item -LiteralPath 'Windows使用说明.txt' -Destination 'dist/词频统计分析工具/Windows使用说明.txt'

      - name: Create distributable zip
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'windows-build.zip'
          $appPath = Join-Path $env:GITHUB_WORKSPACE 'dist/词频统计分析工具'
          Compress-Archive -LiteralPath $appPath -DestinationPath $zipPath -Force
          if (-not (Test-Path -LiteralPath $zipPath)) {
            throw "Windows package was not created: $zipPath"
          }
          Get-Item -LiteralPath $zipPath | Select-Object FullName, Length

      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows-build.zip
          if-no-files-found: error
          retention-days: 30
